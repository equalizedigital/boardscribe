name: Build JS

on:
  # Run on pushes to select branches and on all pull requests.
  push:
    branches:
      - main
      - develop
      - trunk
      - 'feature/**'
      - 'release/**'
      - 'hotfix/[0-9]+.[0-9]+*'
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    name: "Build: JS"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Read-only workflow; don't leave the token in the git config.
          persist-credentials: false

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 'Install NPM packages'
        run: npm install --ignore-scripts

      # The bundle is gitignored, so CI is the only guard that the source
      # modules keep compiling. Release packaging must run this same build.
      - name: Build the frontend bundle
        run: npm run build

      - name: Check expected build artifacts exist
        run: test -f assets/build/boardscribe.js
